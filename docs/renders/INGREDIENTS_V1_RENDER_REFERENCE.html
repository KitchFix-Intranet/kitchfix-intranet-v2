<!--
  STOCKPOT INGREDIENTS, VERSION 1 - RENDER REFERENCE
  The approved design for every Ingredients page, panel and state. Approved by Kevin, Nov 17 2026.

  What this is:   a picture of the design and its behaviour that you can click through.
  What it is not: code to copy. It is plain script and template strings. Build the real thing in the app's own components.
  Data:           every vendor, item, site, number and price in this file is INVENTED. Nothing was read from the database.
  Styles:         the stylesheet to port is INGREDIENTS_V1_PROPOSAL.css, beside this file. The same rules are inlined here
                  with @media rewritten to @container, so the frame can stand in for a window of any size.
  How to use:     the dark strip at the top switches page, viewer, screen size, state and what the next save does.
                  Add #bare to the address to hide the strip.
  Built on:       the repo's tokens.css, globals.css, components.css, shell.css and ident.css at fb40e6a, unchanged.
-->

<style>/* ==== repo at fb40e6a: src/app/tokens.css (unchanged) ==== */
:root{
  --sp-navy:#153968; --sp-navy-deep:#0E2A4E; --sp-navy-mid:#1E4577; --sp-navy-line:#2A4E7F;
  --sp-sky:#C4E3E8; --sp-sky-tint:#E7F1F4; --sp-sky-soft:#F1F7F9; --sp-sky-line:#C9DBE6;
  --sp-red:#E53530; --sp-red-deep:#C92B27;
  --sp-ground:#F3F6F9; --sp-card:#FFFFFF; --sp-raise:#F8FAFC;
  --sp-line:#DCE4EB; --sp-line-soft:#EAEFF3; --sp-line-field:#7F8B9A;
  --sp-ink:#1B2637; --sp-body:#48556A; --sp-muted:#5C6778; --sp-link:#2459A8;
  --sp-on-navy:#FFFFFF; --sp-on-navy-text:#D5DFEC; --sp-on-navy-muted:#B7C6DA; --sp-on-navy-dim:#9AAAC2;
  --sp-good:#1B7A55; --sp-good-bg:#E3F1EA;
  --sp-warn:#8A5A0E; --sp-warn-bg:#F8EDD6; --sp-warn-strong:#C98A1A;
  --sp-block:#C0262A; --sp-block-bg:#FBE8E8; --sp-block-line:#F1C4C4;
  --sp-info-bg:#EEF4FB;
  --sp-disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --sp-ui:Mulish,Verdana,sans-serif;
  --sp-t-micro:12px; --sp-t-label:13px; --sp-t-table:14.5px; --sp-t-body:16px;
  --sp-t-item:18px; --sp-t-h3:20px; --sp-t-title:24px; --sp-t-num:28px;
  --sp-t-h1:30px; --sp-t-value:34px;
  --sp-r-hair:2px; --sp-r-xs:4px; --sp-r-sm:10px; --sp-r-ctl:12px; --sp-r-card:14px; --sp-r-lg:16px; --sp-r-chip:22px; --sp-r-pill:999px;
  --sp-shadow:0 1px 2px rgba(14,42,78,.06),0 4px 14px rgba(14,42,78,.06);
  --sp-shadow-lift:0 2px 4px rgba(14,42,78,.08),0 10px 22px rgba(14,42,78,.12);
  --sp-rail:236px; --sp-rail-slim:76px; --sp-topbar:64px; --sp-tabbar:64px; --sp-canvas-max:1520px;
  --sp-sheet-max:792px;
  --sp-fast:120ms; --sp-base:200ms; --sp-slow:320ms; --sp-rise:480ms; --sp-stagger:40ms; --sp-spin:900ms;
  --sp-ease:cubic-bezier(.2,.8,.2,1); --sp-ease-io:cubic-bezier(.65,0,.35,1);
  --sp-shadow-float:0 8px 24px rgba(14,42,78,.14),0 24px 48px rgba(14,42,78,.10);
  --sp-band:128px; --sp-row:48px;
  --sp-sp-1:4px; --sp-sp-2:8px; --sp-sp-3:12px; --sp-sp-4:16px; --sp-sp-5:24px; --sp-sp-6:32px; --sp-sp-7:40px; --sp-sp-8:48px;
  --sp-z-topbar:10; --sp-z-notch:30; --sp-z-rail-phone:50; --sp-z-drawer:60; --sp-z-toast:90;
  --sp-good-on-navy:#8FD3B4;
  --sp-bad-on-navy:#FF9D94;
  --sp-floor-chef:48px; --sp-floor-corp:44px;
  color-scheme:light}
*:focus-visible{outline:2px solid var(--sp-navy);outline-offset:2px}
@media (prefers-reduced-motion:reduce){:root{--sp-fast:0ms;--sp-base:0ms;--sp-slow:0ms;--sp-rise:0ms;--sp-stagger:0ms}}

/* ==== repo at fb40e6a: src/app/globals.css (unchanged) ==== */
html, body {
  margin: 0;
  padding: 0;
  background: var(--sp-ground);
  color: var(--sp-ink);
  font-family: var(--sp-ui);
  font-size: var(--sp-t-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-variant-numeric: tabular-nums;
}

*, *::before, *::after { box-sizing: border-box; }

h1, h2, h3, h4 {
  font-family: var(--sp-disp);
  font-weight: 700;
  text-transform: uppercase;
  line-height: 1;
  letter-spacing: .2px;
  margin: 0;
  color: var(--sp-ink);
}
h1 { font-size: var(--sp-t-h1); }
h2 { font-size: var(--sp-t-title); }
h3 { font-size: var(--sp-t-h3); }
h4 { font-size: var(--sp-t-item); }

p { margin: 0; }

a {
  color: var(--sp-link);
  text-decoration: none;
}
a:hover { text-decoration: underline; }

button {
  font-family: var(--sp-ui);
  cursor: pointer;
}
button:disabled { cursor: not-allowed; }

/*
 * .kf-eyebrow, .kf-skew-tag, .kf-state, .kf-btn, .kf-pill, .kf-card and the
 * other shared primitives live in components.css now. This file is base type +
 * breakpoint utilities only.
 */

/* Utility: hide on phone / desktop */
/*
 * The two utilities below have to win against any component's own `display`
 * rule, or a mobile-only element will leak into desktop (and vice versa) the
 * moment a component sets `display: flex` / `inline-flex` on itself. We hide
 * with !important and show with `revert` so the element goes back to its
 * natural display, not whatever CSS-initial `inline` happens to be.
 */
.kf-only-desktop { display: revert; }
.kf-only-phone { display: none !important; }
@container kfapp (max-width: 860px) {
  .kf-only-desktop { display: none !important; }
  .kf-only-phone { display: revert !important; }
}

/* ==== repo at fb40e6a: src/app/components.css (unchanged) ==== */
/*
 * Shared component primitives. Imported from layout.tsx right after
 * globals.css. Page CSS files keep layout only; buttons, pills, cards, states,
 * skeletons, reveals, toasts and definition lists live here.
 */

/* ---------- Eyebrow ---------- */
/*
 * The eyebrow's red bar animates scaleX from the left over --sp-slow with a
 * var(--sp-fast) delay, transform-origin at left, keeping the -30deg skew in
 * both keyframes. Pin so no one re-centers the origin and the sheen stays crisp.
 */
.kf-eyebrow {
  display: inline-block;
  font-family: var(--sp-disp);
  font-weight: 700;
  font-size: var(--sp-t-label);
  letter-spacing: 2px;
  text-transform: uppercase;
  /* R-AC20: the bar carries brand red; the word does not. Red on white is
   * 4.30:1 and red on navy-deep is 3.35:1 - both under AA at 13px, and law
   * 12 reserves red for things that block. */
  color: var(--sp-navy);
  position: relative;
}
/* On a navy ground (every IdentBand) the eyebrow word is sky (10.6:1 on
 * --sp-navy-deep); the ::after bar stays red. */
.kf-band .kf-eyebrow { color: var(--sp-sky); }
.kf-eyebrow::after {
  content: "";
  display: block;
  width: 56px;
  height: 5px;
  background: var(--sp-red);
  transform: skewX(-30deg) scaleX(0);
  transform-origin: left center;
  margin-top: var(--sp-sp-1);
  animation: kf-bar-grow var(--sp-slow) var(--sp-ease) 120ms both;
}
.kf-eyebrow--plain::after { display: none; }
.is-revealed .kf-eyebrow::after { animation: none; transform: skewX(-30deg) scaleX(1); }
@keyframes kf-bar-grow {
  from { transform: skewX(-30deg) scaleX(0); }
  to   { transform: skewX(-30deg) scaleX(1); }
}

.kf-skew-tag {
  display: inline-block;
  padding: var(--sp-sp-1) 10px;
  background: var(--sp-sky-tint);
  color: var(--sp-navy-deep);
  font-family: var(--sp-ui);
  font-weight: 700;
  font-size: var(--sp-t-micro);
  text-transform: uppercase;
  letter-spacing: 1px;
  transform: skewX(-12deg);
  border-radius: var(--sp-r-hair);
}
.kf-skew-tag > span { display: inline-block; transform: skewX(12deg); }

/* ---------- Buttons ---------- */
.kf-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-sp-2);
  min-height: var(--sp-floor-chef);
  padding: 0 18px;
  border-radius: var(--sp-r-ctl);
  font-family: var(--sp-ui);
  font-weight: 700;
  font-size: var(--sp-t-body);
  text-decoration: none;
  border: 1px solid transparent;
  background: transparent;
  color: inherit;
  cursor: pointer;
  transition: background var(--sp-fast) var(--sp-ease),
              color var(--sp-fast) var(--sp-ease),
              border-color var(--sp-fast) var(--sp-ease),
              transform var(--sp-fast) var(--sp-ease);
}
.kf-btn:focus-visible { outline: 2px solid var(--sp-navy); outline-offset: 2px; }
.kf-btn:active:not(:disabled) { transform: translateY(1px); }
.kf-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.kf-btn--primary { background: var(--sp-navy); color: var(--sp-on-navy); }
.kf-btn--primary:hover:not(:disabled) { background: var(--sp-navy-deep); }
/* Polish 4 (I): a disabled primary used to render as faded navy that
 * still invited a click. Swap to a muted fill + muted text so the
 * disabled state reads unmistakably. The `.kf-btn:disabled` opacity
 * rule still applies on top (same cursor/opacity floor); this just
 * overrides the fill so it's not "faded navy." */
.kf-btn--primary:disabled {
  background: var(--sp-line-soft);
  color: var(--sp-muted);
  border-color: transparent;
}
.kf-btn--line { color: var(--sp-navy); border-color: var(--sp-navy); background: var(--sp-card); }
.kf-btn--line:hover:not(:disabled) { background: var(--sp-sky-tint); }
.kf-btn--soft { background: var(--sp-sky-tint); color: var(--sp-navy); }
.kf-btn--soft:hover:not(:disabled) { background: var(--sp-sky); }
.kf-btn--ghost { color: var(--sp-navy); }
.kf-btn--ghost:hover:not(:disabled) { background: var(--sp-sky-tint); }
.kf-btn--on-navy { background: var(--sp-on-navy); color: var(--sp-navy-deep); }
.kf-btn--on-navy:hover:not(:disabled) { background: var(--sp-sky); }
.kf-btn--on-navy:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px var(--sp-navy-deep), 0 0 0 4px var(--sp-on-navy);
}
.kf-btn--line-on-navy {
  background: transparent;
  color: var(--sp-on-navy);
  border-color: color-mix(in srgb, white 55%, transparent);
}
.kf-btn--line-on-navy:hover:not(:disabled) {
  background: color-mix(in srgb, white 7%, transparent);
  border-color: var(--sp-on-navy);
}
.kf-btn--sm { min-height: var(--sp-floor-corp); padding: 0 14px; border-radius: var(--sp-r-sm); font-size: var(--sp-t-label); }

.kf-btn.is-busy svg { animation: kf-spin var(--sp-spin) linear infinite; }
.kf-btn.is-busy { pointer-events: none; }

/* Brand the native checkbox / radio without rebuilding them. */
input[type="checkbox"], input[type="radio"] { accent-color: var(--sp-navy); }
/* <Link> can't carry a disabled attribute, so pager uses .is-disabled. */
.kf-btn.is-disabled { opacity: 0.4; pointer-events: none; }
@keyframes kf-spin { to { transform: rotate(360deg); } }

/* ---------- Pills (one family) ---------- */
.kf-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-sp-1);
  padding: 3px 10px;
  border-radius: var(--sp-r-pill);
  font-family: var(--sp-ui);
  font-size: var(--sp-t-micro);
  font-weight: 700;
  white-space: nowrap;
  background: var(--sp-line-soft);
  color: var(--sp-body);
}
.kf-pill--live { background: var(--sp-good-bg); color: var(--sp-good); }
.kf-pill--live::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: var(--sp-r-pill);
  background: var(--sp-good);
}
.kf-pill--info { background: var(--sp-info-bg); color: var(--sp-link); }
/* N9 §2a: New ingredient kind pill - navy fill (vs. Existing match's soft info). */
.kf-pill--new { background: var(--sp-navy); color: var(--sp-on-navy); }
.kf-pill--good { background: var(--sp-good-bg); color: var(--sp-good); }
.kf-pill--warn { background: var(--sp-warn-bg); color: var(--sp-warn); }
.kf-pill--block { background: var(--sp-block-bg); color: var(--sp-block); }
.kf-pill--muted { background: var(--sp-line-soft); color: var(--sp-body); }
.kf-pill--twin { background: var(--sp-sky-tint); color: var(--sp-navy); }
.kf-pill--reserved { background: var(--sp-info-bg); color: var(--sp-link); }
/* G1 (grade model): amber-register tier marker on the linked-items
   row. Register picked deliberately: Premium is noteworthy, not an
   error. Standard has no pill - absence IS the label. */
.kf-pill--premium { background: var(--sp-warn-bg); color: var(--sp-warn-strong); }

/* ---------- Card ---------- */
.kf-card {
  background: var(--sp-card);
  border: 1px solid var(--sp-line);
  border-radius: var(--sp-r-card);
  box-shadow: var(--sp-shadow);
  padding: var(--sp-sp-5);
}
.kf-card > header { margin-bottom: var(--sp-sp-3); }
.kf-card h3 { color: var(--sp-navy); font-size: var(--sp-t-h3); margin-top: var(--sp-sp-1); }
.kf-card__muted { color: var(--sp-muted); font-size: var(--sp-t-body); }
.kf-card__foot {
  margin-top: var(--sp-sp-3);
  padding-top: var(--sp-sp-3);
  border-top: 1px solid var(--sp-line-soft);
  font-size: var(--sp-t-micro);
  color: var(--sp-muted);
}

/* ---------- Empty + error ---------- */
.kf-state {
  padding: var(--sp-sp-5);
  border-radius: var(--sp-r-card);
  background: var(--sp-card);
  border: 1px solid var(--sp-line);
}
.kf-state__title { font-family: var(--sp-ui); font-size: 17px; font-weight: 800; color: var(--sp-ink); margin-bottom: var(--sp-sp-1); }
.kf-state__body  { font-family: var(--sp-ui); font-size: var(--sp-t-body); color: var(--sp-muted); }

.kf-empty {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-sp-3);
  padding: var(--sp-sp-5);
  background: var(--sp-card);
  border: 1px solid var(--sp-line);
  border-radius: var(--sp-r-card);
}
.kf-empty__icon {
  width: 44px; height: 44px; flex: 0 0 44px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--sp-sky-tint); color: var(--sp-navy);
  border-radius: var(--sp-r-ctl);
}
.kf-empty__title { font-family: var(--sp-ui); font-size: 17px; font-weight: 800; color: var(--sp-ink); }
.kf-empty__body  { font-family: var(--sp-ui); font-size: var(--sp-t-body); color: var(--sp-muted); margin-top: var(--sp-sp-1); }

.kf-error {
  background: var(--sp-card);
  border: 1px solid var(--sp-block-line);
  border-radius: var(--sp-r-card);
  padding: var(--sp-sp-5);
  display: flex;
  flex-direction: column;
  gap: var(--sp-sp-3);
}
.kf-error__title { color: var(--sp-block); font-family: var(--sp-ui); font-size: 17px; font-weight: 800; }
.kf-error__body  { color: var(--sp-body); font-size: var(--sp-t-body); }

/* ---------- Skeletons (shimmer) ---------- */
.kf-skel {
  position: relative;
  overflow: hidden;
  background: var(--sp-line-soft);
  border-radius: var(--sp-r-sm);
}
.kf-skel::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(
    90deg,
    transparent 0%,
    color-mix(in srgb, white 60%, transparent) 50%,
    transparent 100%
  );
  animation: kf-shimmer 1.4s linear infinite;
}
.kf-skel--navy { background: var(--sp-navy-mid); }
.kf-skel--navy::after {
  background: linear-gradient(
    90deg,
    transparent 0%,
    color-mix(in srgb, white 14%, transparent) 50%,
    transparent 100%
  );
}
.kf-skel--line { background: var(--sp-line); height: 12px; }
@keyframes kf-shimmer {
  from { transform: translateX(-100%); }
  to   { transform: translateX(100%); }
}
@media (prefers-reduced-motion: reduce) {
  .kf-skel::after { animation: none; }
}

/* ---------- Reveal + stagger ---------- */
.kf-reveal {
  opacity: 0;
  transform: translateY(8px);
  animation: kf-reveal var(--sp-base) var(--sp-ease) forwards;
  animation-delay: calc(var(--i, 0) * var(--sp-stagger));
}
@keyframes kf-reveal {
  to { opacity: 1; transform: translateY(0); }
}
.is-revealed .kf-reveal { animation: none; opacity: 1; transform: none; }

/* ---------- Toast ---------- */
.kf-toaster {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--sp-sp-5) + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: center;
  z-index: var(--sp-z-toast);
  pointer-events: none;
}
.kf-toast {
  pointer-events: auto;
  background: var(--sp-ink);
  color: var(--sp-on-navy);
  border-radius: var(--sp-r-ctl);
  box-shadow: var(--sp-shadow-float);
  padding: 8px 8px 8px 16px;
  min-height: var(--sp-floor-corp);
  display: inline-flex;
  align-items: center;
  gap: var(--sp-sp-3);
  font-family: var(--sp-ui);
  font-size: var(--sp-t-body);
  animation: kf-toast-in var(--sp-base) var(--sp-ease);
  max-width: min(560px, calc(100cqw - var(--sp-sp-5) * 2));
}
.kf-toast--block { background: var(--sp-block); }
.kf-toast--good { background: var(--sp-navy); }
.kf-toast--good > svg { flex: 0 0 auto; color: var(--sp-good-on-navy); }
.kf-toast.is-leaving { animation: kf-toast-out var(--sp-base) var(--sp-ease) both; }
@keyframes kf-toast-out {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(8px); }
}
.kf-toast__undo {
  min-height: var(--sp-floor-corp);
  padding: 0 14px;
  background: color-mix(in srgb, white 10%, transparent);
  color: var(--sp-on-navy);
  border: none;
  border-radius: var(--sp-r-sm);
  font-family: var(--sp-ui);
  font-weight: 700;
  cursor: pointer;
}
.kf-toast__undo:hover { background: color-mix(in srgb, white 18%, transparent); }
@keyframes kf-toast-in {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .kf-toast { animation: none; }
  .kf-toast.is-leaving { animation: none; }
}

/* ---------- KV (definition rows) ---------- */
.kf-kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-sp-2) var(--sp-sp-4); margin: 0; }
.kf-kv > div { display: contents; }
.kf-kv dt {
  font-family: var(--sp-ui);
  color: var(--sp-body);
  font-size: var(--sp-t-table);
  padding: var(--sp-sp-2) 0;
  border-bottom: 1px solid var(--sp-line-soft);
}
.kf-kv dd {
  margin: 0;
  text-align: right;
  font-family: var(--sp-ui);
  font-weight: 700;
  color: var(--sp-ink);
  font-size: var(--sp-t-table);
  padding: var(--sp-sp-2) 0;
  border-bottom: 1px solid var(--sp-line-soft);
}
.kf-kv .is-missing dd,
.kf-kv dd.is-missing { color: var(--sp-muted); font-weight: 500; }

/* ==== repo at fb40e6a: src/components/shell/shell.css (unchanged) ==== */
/*
 * Shell chrome. Grid is `auto | minmax(0, 1fr)` so content never pushes the
 * canvas off its gutter. Rail width is a CSS variable so collapse animates.
 */
.kf-shell {
  --rail-width: var(--sp-rail);
  min-height: 100cqh;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  background: var(--sp-ground);
}
.kf-shell--slim { --rail-width: var(--sp-rail-slim); }

/* --------------------- Rail --------------------- */
.kf-rail {
  position: sticky;
  top: 0;
  height: 100cqh;
  width: var(--rail-width);
  background: var(--sp-navy-deep);
  color: var(--sp-on-navy-text);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--sp-navy-line);
  overflow: hidden;
  transition: width var(--sp-base) var(--sp-ease);
}

.kf-rail__brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-sp-2);
  padding: 0 var(--sp-sp-4);
  min-height: var(--sp-topbar);
}
.kf-rail__brand-mark {
  display: inline-flex;
  align-items: center;
  color: var(--sp-on-navy);
  line-height: 1;
}
.kf-rail__logo { display: block; height: auto; width: auto; }
.kf-rail__logo--horizontal { height: 40px; max-width: 148px; }
.kf-rail__logo--circle     { height: 44px; width: 44px; }

.kf-shell--slim .kf-rail__brand {
  justify-content: center;
  padding: 0;
}
.kf-shell--slim .kf-rail__logo--circle { height: 40px; width: 40px; }

/* -------- Notch toggle (replaces .kf-rail__collapse) --------
 * Positioned off the rail's right edge so its mid-point sits on the rail
 * border. 28px visual circle, 44px hit via an ::before mask. Pinned by
 * co-ordinates deliberately (DO NOT re-nest inside the rail - its
 * overflow:hidden clips the circle in half).
 */
.kf-rail__notch {
  position: fixed;
  z-index: var(--sp-z-notch);
  left: calc(var(--rail-width) - 14px);
  top: calc(var(--sp-topbar) / 2 - 14px);
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--sp-card);
  border: 1px solid var(--sp-line);
  box-shadow: var(--sp-shadow-float);
  color: var(--sp-navy);
  padding: 0;
  cursor: pointer;
  transition: left var(--sp-base) var(--sp-ease),
              transform var(--sp-fast) var(--sp-ease),
              border-color var(--sp-fast) var(--sp-ease);
}
.kf-rail__notch::before {
  content: "";
  position: absolute;
  inset: -8px;
  border-radius: 50%;
}
.kf-rail__notch-inner {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%; height: 100%;
  transition: transform var(--sp-base) var(--sp-ease);
}
.kf-shell--slim .kf-rail__notch-inner { transform: rotate(180deg); }
.kf-rail__notch:hover { transform: scale(1.1); border-color: var(--sp-navy); }
.kf-rail__notch:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px var(--sp-card), 0 0 0 4px var(--sp-navy), var(--sp-shadow-float);
}

/* -------- Level 2 (Stockpot) back row + section label -------- */
/*
 * Quiet tertiary back-link that recedes above the section label - no
 * divider, dim text, brightens on hover.
 */
.kf-rail__back {
  display: flex;
  align-items: center;
  gap: var(--sp-sp-2);
  min-height: 44px;
  padding: 0 var(--sp-sp-4);
  color: var(--sp-on-navy-dim);
  font-family: var(--sp-ui);
  font-weight: 500;
  font-size: 13px;
  text-decoration: none;
}
.kf-rail__back:hover {
  background: color-mix(in srgb, white 7%, transparent);
  color: var(--sp-on-navy);
  text-decoration: none;
}
.kf-rail__back-ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px; height: 20px;
  flex: 0 0 20px;
}
.kf-rail__back-label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.kf-shell--slim .kf-rail__back { justify-content: center; padding: 0; }
.kf-shell--slim .kf-rail__back-label { display: none; }

.kf-rail__section {
  padding: var(--sp-sp-3) var(--sp-sp-4) var(--sp-sp-2);
  color: var(--sp-on-navy-dim);
  font-family: var(--sp-disp);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.kf-shell--slim .kf-rail__section { display: none; }

/* -------- Rail divider (People lane, T0a) -------- */
.kf-rail__divider {
  list-style: none;
  height: 0;
  margin: var(--sp-sp-2) var(--sp-sp-3);
  border-top: 1px solid var(--sp-navy-line);
}
.kf-shell--slim .kf-rail__divider {
  margin: var(--sp-sp-2) var(--sp-sp-4);
}

/* -------- Rail nav items -------- */
.kf-rail__nav {
  padding: var(--sp-sp-1) var(--sp-sp-3);
  flex: 1;
  overflow-y: auto;
}
.kf-rail__nav ul {
  list-style: none;
  margin: 0; padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.kf-rail__item {
  display: flex;
  align-items: center;
  gap: var(--sp-sp-3);
  height: var(--sp-floor-chef);
  padding: 0 var(--sp-sp-3);
  border-radius: var(--sp-r-sm);
  color: var(--sp-on-navy-text);
  font-family: var(--sp-ui);
  font-size: var(--sp-t-body);
  font-weight: 600;
  text-decoration: none;
  position: relative;
}
.kf-rail__item:hover {
  background: color-mix(in srgb, white 7%, transparent);
  text-decoration: none;
}
.kf-rail__item--active {
  background: var(--sp-sky-tint);
  color: var(--sp-navy);
}
.kf-rail__label {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity var(--sp-fast) var(--sp-ease);
}
.kf-rail__dot {
  width: 8px; height: 8px;
  background: var(--sp-sky);
  border-radius: var(--sp-r-pill);
  display: inline-block;
}
/*
 * Rail count badge. Academy "To do" uses this to show remaining
 * requirements. R-AC19: sky background, navy text - not red. Red is for
 * things that block; a count of documents to read does not block.
 * In slim mode the badge pins to the icon's top-right corner, same place
 * as the live dot (and taking priority when both would fire).
 */
.kf-rail__count {
  min-width: 22px;
  height: 22px;
  padding: 0 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--sp-sky);
  color: var(--sp-navy);
  border-radius: var(--sp-r-pill);
  font-family: var(--sp-ui);
  font-weight: 700;
  font-size: var(--sp-t-micro);
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}

/* Slim mode: label collapses OUT OF FLOW (not just opacity) so the icon
   truly centers; each item becomes a centered square the active/hover
   highlight hugs; the live dot pins to the icon's top-right corner, not
   the item's edge. See docs/GOTCHAS.md - opacity:0 keeps a flex child in
   flow and the icon drifts; width/flex 0 removes it. */
.kf-shell--slim .kf-rail__label {
  opacity: 0;
  width: 0;
  flex: 0 0 0;
  pointer-events: none;
}
.kf-shell--slim .kf-rail__item {
  justify-content: center;
  gap: 0;
  width: 44px;
  height: 44px;
  margin: 0 auto;
  padding: 0;
}
.kf-shell--slim .kf-rail__dot {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 6px;
  height: 6px;
}
.kf-shell--slim .kf-rail__count {
  position: absolute;
  top: 6px;
  right: 6px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  font-size: 11px;
}

/* -------- Account row -------- */
.kf-rail__foot {
  padding: var(--sp-sp-3);
  border-top: 1px solid var(--sp-navy-mid);
}
.kf-account { position: relative; }
.kf-account__btn {
  width: 100%;
  min-height: 56px;
  display: flex;
  align-items: center;
  gap: var(--sp-sp-3);
  background: transparent;
  color: var(--sp-on-navy);
  border: 1px solid transparent;
  border-radius: var(--sp-r-ctl);
  padding: var(--sp-sp-2) var(--sp-sp-3);
  cursor: pointer;
  text-align: left;
}
.kf-account__btn:hover,
.kf-account__btn.is-open { background: color-mix(in srgb, white 7%, transparent); }
.kf-account__ini {
  width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--sp-navy-mid);
  color: var(--sp-on-navy);
  border-radius: var(--sp-r-pill);
  font-family: var(--sp-ui);
  font-weight: 700;
  font-size: 13px;
  flex: 0 0 32px;
}
.kf-account__who {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  line-height: 1.25;
}
.kf-account__name {
  font-family: var(--sp-ui);
  font-weight: 700;
  font-size: 14px;
  color: var(--sp-on-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.kf-account__email {
  color: var(--sp-on-navy-dim);
  font-family: var(--sp-ui);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.kf-account__caret { color: var(--sp-on-navy-text); transition: transform var(--sp-fast) var(--sp-ease); }
.kf-account__btn.is-open .kf-account__caret { transform: rotate(180deg); }
.kf-shell--slim .kf-account__btn { justify-content: center; padding: var(--sp-sp-2); }

.kf-account__menu {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  min-width: 220px;
  background: var(--sp-card);
  color: var(--sp-ink);
  border-radius: var(--sp-r-ctl);
  box-shadow: var(--sp-shadow-float);
  padding: var(--sp-sp-1);
  z-index: var(--sp-z-notch);
}
.kf-account__menu--slim {
  left: calc(100% + 8px);
  bottom: auto;
  top: 0;
}
.kf-account__item {
  width: 100%;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: var(--sp-sp-2);
  background: transparent;
  color: var(--sp-ink);
  border: none;
  border-radius: var(--sp-r-sm);
  padding: 0 var(--sp-sp-3);
  font-family: var(--sp-ui);
  font-weight: 700;
  cursor: pointer;
  text-align: left;
}
.kf-account__item:hover { background: var(--sp-sky-tint); color: var(--sp-navy); }

/* --------------------- Topbar / canvas --------------------- */
.kf-main { min-width: 0; }

.kf-topbar {
  position: sticky;
  top: 0;
  background: var(--sp-card);
  border-bottom: 1px solid var(--sp-line);
  min-height: var(--sp-topbar);
  display: flex;
  align-items: center;
  gap: var(--sp-sp-3);
  padding: 0 var(--sp-sp-5);
  z-index: var(--sp-z-topbar);
}
.kf-topbar__title {
  display: flex;
  align-items: baseline;
  gap: var(--sp-sp-3);
  flex: 1;
  min-width: 0;
}
.kf-topbar__title h1 {
  font-size: var(--sp-t-title);
  color: var(--sp-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.kf-topbar__crumb {
  color: var(--sp-muted);
  font-family: var(--sp-ui);
  font-size: var(--sp-t-micro);
  display: inline-flex;
  align-items: center;
  gap: var(--sp-sp-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.kf-topbar__actions {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-sp-2);
  flex: 0 0 auto;
}
.kf-topbar__actions:empty { display: none; }

/*
 * Progress bar for topbar busy state. 2px --sp-red bar on the topbar's
 * bottom edge; scaleX(0) at rest; .is-busy on the topbar scales it to .85
 * over 600ms; completes to 1 and fades when the transition settles.
 */
.kf-topbar__progress {
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: var(--sp-red);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 600ms var(--sp-ease), opacity var(--sp-base) var(--sp-ease);
  pointer-events: none;
  opacity: 0;
}
.kf-topbar.is-busy .kf-topbar__progress { transform: scaleX(0.85); opacity: 1; }
.kf-topbar.is-busy-complete .kf-topbar__progress {
  transform: scaleX(1);
  opacity: 0;
  transition: transform var(--sp-base) var(--sp-ease), opacity var(--sp-slow) var(--sp-ease);
}

.kf-canvas {
  max-width: var(--sp-canvas-max);
  margin: 0 auto;
  padding: var(--sp-sp-5);
}

/* --------------------- Phone layout --------------------- */
@container kfapp (max-width: 860px) {
  .kf-shell { grid-template-columns: 1fr; }
  .kf-rail {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    max-width: 86cqw;
    height: 100cqh;
    transform: translateX(-100%);
    transition: transform var(--sp-base) var(--sp-ease);
    z-index: var(--sp-z-rail-phone);
    border-right: none;
  }
  .kf-rail--open { transform: translateX(0); }
  .kf-rail__backdrop {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--sp-navy-deep) 45%, transparent);
    z-index: calc(var(--sp-z-rail-phone) - 1);
  }
  .kf-topbar { padding: 0 var(--sp-sp-4); min-height: 56px; }
  /* The h1 does not shrink in the flex row. Basis is its intrinsic
   * width (flex-shrink: 0) so the crumb absorbs all shrinkage and
   * the title stays whole wherever there is space to hold it. The
   * last-resort cap is the h1's own max-width: 100 % of the title
   * wrapper - when the h1 alone cannot fit beside the actions, it
   * ellipses against its own box rather than overlapping anything. */
  .kf-topbar__title h1 {
    font-size: 20px;
    flex: 0 0 auto;
    max-width: 100%;
    min-width: 0;
  }
  /* The crumb is the shrinker: basis 0, grow 1, shrink 1. It grows
   * into the space the h1 does not need, and ellipses down to 0 as
   * the row tightens. The base rule already carries overflow
   * hidden + text-overflow ellipsis + white-space nowrap. */
  .kf-topbar__crumb { flex: 1 1 0%; }
  .kf-rail__close { display: inline-flex; }
  .kf-canvas { padding: var(--sp-sp-4); padding-bottom: calc(var(--sp-tabbar) + var(--sp-sp-5)); }
}

/* --------------------- Tab bar (phone) --------------------- */
.kf-tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--sp-tabbar);
  background: var(--sp-navy-deep);
  color: var(--sp-on-navy-text);
  display: none;
  justify-content: space-around;
  align-items: stretch;
  z-index: calc(var(--sp-z-rail-phone) - 10);
  border-top: 1px solid var(--sp-navy-line);
}
.kf-tabbar__item {
  flex: 1;
  background: transparent;
  color: var(--sp-on-navy-dim);
  border: none;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-sp-1);
  text-decoration: none;
  font-family: var(--sp-ui);
  font-size: 11px;
  font-weight: 700;
  min-height: var(--sp-floor-chef);
  padding: var(--sp-sp-1) var(--sp-sp-1);
}
.kf-tabbar__item--active { color: var(--sp-sky); }
.kf-tabbar__item:hover { text-decoration: none; }
@container kfapp (max-width: 860px) { .kf-tabbar { display: flex; } }

/* Rail close (phone only) */
.kf-rail__close {
  background: transparent;
  color: var(--sp-on-navy-text);
  border: 1px solid transparent;
  border-radius: var(--sp-r-sm);
  width: 32px; height: 32px;
  align-items: center;
  justify-content: center;
}
.kf-rail__close:hover { background: color-mix(in srgb, white 7%, transparent); }

/* ==== repo at fb40e6a: src/components/ui/ident.css (unchanged) ==== */
/*
 * Identity band. The <section> itself carries .kf-only-desktop and must NOT
 * set its own display - the grid is on the inner .kf-band__frame div, so the
 * utility class can hide the band at phone widths without being overridden.
 */
.kf-band { margin-bottom: var(--sp-sp-5); }
/*
 * Band frame: height is pinned to --sp-band (128) exactly. The content
 * (eyebrow + bar + h2 + kick) plus 14px top/bottom padding and the 4px
 * left-column gap totals 128 at the display font-metrics; measured at
 * 1440 and 1280 - no overflow, no clipping.
 */
.kf-band__frame {
  position: relative;
  background: var(--sp-navy-deep);
  color: var(--sp-on-navy);
  border-radius: var(--sp-r-lg);
  overflow: hidden;
  padding: 14px var(--sp-sp-6);
  height: var(--sp-band);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--sp-sp-5);
  align-items: center;
  box-sizing: border-box;
  /* Polish 7: resting surface per DESIGN.md section 8. Puts the
   * hero on the same elevation as .kf-rvc / .kf-tile / .kf-wb__index
   * so sibling surfaces never differ. */
  box-shadow: var(--sp-shadow);
}
.kf-band__sheen {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    125deg,
    var(--sp-navy-mid) 0%,
    var(--sp-navy-mid) 42%,
    transparent 72%
  );
  opacity: 0.55;
  transform: skewX(-30deg) translateX(-20%);
  pointer-events: none;
}

/* Left column */
.kf-band__left {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-sp-1);
  min-width: 0;
}
.kf-band__eyebrow { color: var(--sp-red); }
.kf-band__title {
  color: var(--sp-on-navy);
  font-family: var(--sp-disp);
  font-weight: 800;
  font-size: var(--sp-t-h1);
  line-height: 1;
  letter-spacing: .2px;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin: 2px 0 0;
}
.kf-band__kick {
  color: var(--sp-on-navy-text);
  font-family: var(--sp-ui);
  font-size: var(--sp-t-body);
  display: inline-flex;
  align-items: center;
  gap: var(--sp-sp-2);
  min-width: 0;
}
.kf-band__kick-text {
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Right column: facts + CTA */
.kf-band__right {
  position: relative;
  display: inline-flex;
  align-items: stretch;
  gap: var(--sp-sp-6);
}

.kf-band-fact {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  border-right: 1px solid var(--sp-navy-line);
  padding-right: var(--sp-sp-6);
}
.kf-band__right > .kf-band-fact:last-of-type { border-right: none; padding-right: 0; }
.kf-band-fact__label {
  font-family: var(--sp-disp);
  font-size: var(--sp-t-label);
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--sp-on-navy-dim);
}
.kf-band-fact__value {
  font-family: var(--sp-disp);
  font-weight: 800;
  font-size: var(--sp-t-num);
  color: var(--sp-on-navy);
  line-height: 1;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-sp-2);
}
.kf-band-fact__note {
  color: var(--sp-good-on-navy);
  font-family: var(--sp-ui);
  font-size: var(--sp-t-micro);
  font-weight: 700;
}

/* Pulsing dot for the running state */
.kf-band-fact__dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: var(--sp-r-pill);
  background: var(--sp-sky);
  animation: kf-pulse 1.4s var(--sp-ease) infinite;
}
.kf-band-fact--warn .kf-band-fact__value { color: var(--sp-warn-strong); }
.kf-band-fact--warn .kf-band-fact__note  { color: var(--sp-warn-bg); }
.kf-band-fact--muted .kf-band-fact__value { color: var(--sp-on-navy-dim); }
.kf-band-fact--muted .kf-band-fact__note  { color: var(--sp-on-navy-muted); }
.kf-band-fact--good .kf-band-fact__value { color: var(--sp-good-on-navy); }
.kf-band-fact--bad  .kf-band-fact__value { color: var(--sp-bad-on-navy); }
@keyframes kf-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.3); opacity: .55; }
}
@media (prefers-reduced-motion: reduce) {
  .kf-band-fact__dot { animation: none; }
}

.kf-band__cta {
  display: inline-flex;
  align-items: center;
}

/*
 * Compact-desktop rule: at and below 1280px the facts + separators disappear
 * and the headline drops to --sp-t-title; the CTA stays. The band itself
 * stays visible down to the 860px phone breakpoint where .kf-only-desktop
 * hides it.
 */
@container kfapp (max-width: 1280px) {
  .kf-band__right { display: none; }
  .kf-band__title { font-size: var(--sp-t-title); }
}

/* Kick info popover */
.kf-kickinfo { position: relative; display: inline-flex; }
.kf-kickinfo__btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px; height: 24px;
  padding: 0;
  background: transparent;
  color: var(--sp-on-navy-dim);
  border: 1px solid transparent;
  border-radius: var(--sp-r-pill);
  cursor: pointer;
  transition: color var(--sp-fast) var(--sp-ease), background var(--sp-fast) var(--sp-ease);
}
.kf-kickinfo__btn:hover,
.kf-kickinfo__btn[aria-expanded="true"] {
  color: var(--sp-on-navy);
  background: color-mix(in srgb, white 10%, transparent);
}
.kf-kickinfo__btn::before {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: var(--sp-r-pill);
}
.kf-kickinfo__pop {
  position: absolute;
  top: calc(100% + 10px);
  left: 0;
  width: min(420px, calc(100cqw - var(--sp-sp-5) * 2));
  background: var(--sp-card);
  color: var(--sp-body);
  border: 1px solid var(--sp-line);
  border-radius: var(--sp-r-card);
  box-shadow: var(--sp-shadow-float);

/* ==== THE PROPOSAL (the same rules as INGREDIENTS_V1_PROPOSAL.css; here @media reads @container so the frame below can stand in for a window) ==== */
/* =====================================================================
   Stockpot Ingredients - version 1 - the stylesheet to port
   Approved as a render by Kevin, Nov 17 2026. Written on the repo's
   tokens at fb40e6a. Colour, type size, spacing, radius, shadow and
   motion come from tokens only. Raw pixels appear only for structure
   (column widths, hairlines, icon boxes).

   Three parts:
     A. New tokens            -> src/app/tokens.css            (train 1)
     B. Shared changes        -> components.css, shell.css,
                                 ident.css                     (train 1)
     C. Stockpot Ingredients  -> the Stockpot stylesheets      (trains 2 on)

   Five type sizes on a screen:
     desk working tabs  12 / 13 / 14.5 / 16 / 24
     Overview           12 / 13 / 16 / 24 / 30
     phone              12 / 13 / 16 / 20 / 24
   12px is for dates and counts only.

   Every rule here passed the battery at 1440x900, 1366x768, 820x1180,
   390x844 and 360x640 and at every width from 320 to 1920: no control
   under the floor, no sideways scroll, no text cut off, no contrast miss.
   Port the rules; do not re-derive the sizes. Rename a class only where
   it collides with one in the repo.
   ===================================================================== */

/* ==== A. NEW TOKENS (train 1 adds these to src/app/tokens.css) ======== */
:root {
  --sp-w-regular: 400; --sp-w-semi: 600; --sp-w-bold: 700; --sp-w-heavy: 800;   /* the four weights the font link loads */
  --sp-lh-flat: 1; --sp-lh-tight: 1.1; --sp-lh-snug: 1.3; --sp-lh-body: 1.5;    /* display heads / display numbers / names that wrap / prose */
  --sp-z-skip: 100;                                                              /* the skip link sits above everything, toasts included */
}

/* ==== B. SHARED CHANGES (train 1; every lane stands on these) ========= */
/* components.css */
@container kfapp (max-width: 860px) { .kf-btn--sm { min-height: var(--sp-floor-chef); } }             /* S3: the small button meets the phone floor */
.kf-state__title, .kf-empty__title, .kf-error__title { font-size: var(--sp-t-body); }       /* raw 17px retired */
.kf-pill--premium { background: var(--sp-sky-tint); color: var(--sp-navy); }                 /* S7: a grade is not a warning. 10.06 to 1 */
.kf-toaster { flex-direction: column; align-items: center; gap: var(--sp-sp-2); }            /* S4 */
.kf-toast__undo { font-size: var(--sp-t-label); }
.kf-toast__x { width: var(--sp-floor-corp); min-height: var(--sp-floor-corp); display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--sp-on-navy); border-radius: var(--sp-r-sm); cursor: pointer; }
.kf-toast__x:hover { background: color-mix(in srgb, white 14%, transparent); }
.kf-skiplink { position: absolute; left: var(--sp-sp-3); top: calc(-1 * var(--sp-sp-8) - var(--sp-sp-5)); z-index: var(--sp-z-skip); }   /* S9: off screen until it has focus */
.kf-skiplink:focus { top: var(--sp-sp-3); }
/* shell.css: raw sizes move onto tokens; the account row shows a role where the email was */
.kf-canvas:focus { outline: none; }                                                          /* the skip link lands here; no ring around the whole page */
.kf-rail__section { font-size: var(--sp-t-micro); }
.kf-rail__back { font-size: var(--sp-t-label); }
.kf-account__name { font-size: var(--sp-t-label); }
.kf-account__ini { font-size: var(--sp-t-label); }
.kf-account__role { color: var(--sp-on-navy-dim); font-family: var(--sp-ui); font-size: var(--sp-t-micro); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kf-tabbar__item { font-size: var(--sp-t-micro); }                                           /* 11px retired */
@container kfapp (max-width: 860px) {
  .kf-rail__close { width: var(--sp-floor-chef); height: var(--sp-floor-chef); }
  .kf-rail__back { min-height: var(--sp-floor-chef); }
}
/* ident.css */
.kf-band-fact__value { font-size: var(--sp-t-h1); }                                          /* S15: one display size in the band (28 -> 30) */
@container kfapp (max-width: 1280px) { .kf-band__right { display: inline-flex; } .kf-band__right > .kf-band-fact { display: none; } }   /* S16: facts hide, the lead button stays (what docs/DESIGN.md already says) */

/* ==== C. STOCKPOT INGREDIENTS (trains 2 on) ============================ */
.kf-ing > .kf-band { margin-bottom: 0; }                                                     /* the page stack sets the gap */
/* ---------- top bar facts (the one line that replaces the band) ------ */
.kf-topfacts { display: inline-flex; align-items: center; gap: var(--sp-sp-4); color: var(--sp-body); font-size: var(--sp-t-label); white-space: nowrap; }
.kf-topfacts b { color: var(--sp-ink); font-weight: var(--sp-w-heavy); font-size: var(--sp-t-body); }
.kf-topfacts__sep { width: 1px; height: var(--sp-sp-4); background: var(--sp-line); }
.kf-topfacts--warn b { color: var(--sp-warn); }
@container kfapp (max-width: 1100px) { .kf-topfacts { display: none; } }

/* ---------- tabs (as today) ------------------------------------------ */
.kf-ing { display: flex; flex-direction: column; gap: var(--sp-sp-3); }
.kf-tabs { display: flex; gap: var(--sp-sp-1); border-bottom: 2px solid var(--sp-line); overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain; scrollbar-width: none; }

.kf-tab { display: inline-flex; align-items: center; gap: var(--sp-sp-2); min-height: var(--sp-floor-chef); padding: 0 var(--sp-sp-4); color: var(--sp-body); font-family: var(--sp-ui); font-weight: var(--sp-w-bold); font-size: var(--sp-t-body); text-decoration: none; border: none; background: none; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.kf-tab:hover { color: var(--sp-navy); text-decoration: none; }

.kf-search input { width: 100%; min-height: var(--sp-floor-corp); padding: 0 var(--sp-sp-8) 0 var(--sp-sp-7); border: 1px solid var(--sp-line-field); border-radius: var(--sp-r-ctl); background: var(--sp-card); font-family: var(--sp-ui); font-size: var(--sp-t-body); color: var(--sp-ink); }

.kf-search__clear { position: absolute; right: 0; width: var(--sp-floor-corp); height: var(--sp-floor-corp); display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--sp-body); border-radius: var(--sp-r-ctl); }
.kf-ctl { min-height: var(--sp-floor-corp); padding: 0 var(--sp-sp-3); border: 1px solid var(--sp-line-field); border-radius: var(--sp-r-ctl); background: var(--sp-card); font-family: var(--sp-ui); font-size: var(--sp-t-body); color: var(--sp-ink); max-width: 100%; }
select.kf-ctl { padding-right: var(--sp-sp-6); }
.kf-ctl:disabled { background: var(--sp-raise); color: var(--sp-muted); }
.kf-ctl--num { width: 112px; text-align: right; font-variant-numeric: tabular-nums; }
.kf-labelled { display: inline-flex; align-items: center; gap: var(--sp-sp-2); font-size: var(--sp-t-label); font-weight: var(--sp-w-bold); color: var(--sp-body); white-space: nowrap; }
.kf-count { margin-left: auto; font-size: var(--sp-t-label); color: var(--sp-body); white-space: nowrap; }
.kf-count b { color: var(--sp-ink); }

.kf-chip-row { display: flex; gap: var(--sp-sp-2); flex-wrap: wrap; align-items: center; }
.kf-chip { position: relative; min-height: 36px; padding: 0 var(--sp-sp-3); border-radius: var(--sp-r-pill); border: 1px solid var(--sp-line-field); background: var(--sp-card); font-family: var(--sp-ui); font-weight: var(--sp-w-bold); font-size: var(--sp-t-label); color: var(--sp-ink); display: inline-flex; align-items: center; gap: var(--sp-sp-2); white-space: nowrap; cursor: pointer; }
.kf-chip::before { content: ""; position: absolute; inset: -4px 0; }                 /* 44px hit area */
.kf-chip:hover { background: var(--sp-sky-soft); }
.kf-chip i { font-style: normal; font-weight: var(--sp-w-regular); font-size: var(--sp-t-micro); color: var(--sp-body); }
.kf-chip--on { background: var(--sp-navy); border-color: var(--sp-navy); color: var(--sp-on-navy); }

.kf-chipgroup { display: inline-flex; align-items: center; gap: var(--sp-sp-2); flex-wrap: wrap; }
.kf-chipgroup__label { font-size: var(--sp-t-label); font-weight: var(--sp-w-bold); color: var(--sp-body); }
.kf-vsep { width: 1px; align-self: stretch; background: var(--sp-line); margin: 0 var(--sp-sp-1); }

/* ---------- list + detail -------------------------------------------- */
.kf-split { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: var(--sp-sp-3); align-items: start; }

.kf-pane__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sp-2); padding: var(--sp-sp-2) var(--sp-sp-3) var(--sp-sp-2) var(--sp-sp-4); border-bottom: 1px solid var(--sp-line-soft); min-height: var(--sp-floor-chef); font-size: var(--sp-t-label); color: var(--sp-body); }

.kf-row__price { font-size: var(--sp-t-body); font-weight: var(--sp-w-bold); text-align: right; white-space: nowrap; }

.kf-row__sub { font-size: var(--sp-t-label); color: var(--sp-body); min-width: 0; overflow-wrap: anywhere; }

.kf-detail { display: flex; flex-direction: column; min-width: 0; }

.kf-dhead__name { font-family: var(--sp-disp); font-weight: var(--sp-w-heavy); font-size: var(--sp-t-title); line-height: var(--sp-lh-tight); text-transform: uppercase; color: var(--sp-navy); overflow-wrap: anywhere; margin: 0; }

.kf-dhead__acts { display: inline-flex; gap: var(--sp-sp-2); flex: 0 0 auto; }

.kf-facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--sp-line-soft); border-bottom: 1px solid var(--sp-line-soft); background: var(--sp-raise); }

.kf-rvc__total { margin-left: auto; text-align: right; font-size: var(--sp-t-label); color: var(--sp-body); white-space: nowrap; }
.kf-rvc__total b { font-size: var(--sp-t-body); color: var(--sp-ink); }
.kf-rvc__why { font-size: var(--sp-t-label); color: var(--sp-body); }
.kf-rvc__acts { display: flex; align-items: center; gap: var(--sp-sp-2); flex-wrap: wrap; padding: var(--sp-sp-3) var(--sp-sp-4); background: var(--sp-raise); border-top: 1px solid var(--sp-line-soft); }
.kf-rvc__exits { display: inline-flex; align-items: center; gap: var(--sp-sp-2); flex-wrap: wrap; margin-left: auto; }
.kf-rvc__help { padding: 0 var(--sp-sp-4) var(--sp-sp-3); background: var(--sp-raise); font-size: var(--sp-t-label); color: var(--sp-body); }
.kf-rvc__help b { color: var(--sp-ink); }
.kf-panel { border-top: 1px solid var(--sp-line); padding: var(--sp-sp-4); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-sp-4); background: var(--sp-card); }
.kf-panel__title { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sp-3); }
.kf-panel__title h4 { font-family: var(--sp-ui); font-size: var(--sp-t-body); font-weight: var(--sp-w-heavy); text-transform: none; letter-spacing: 0; margin: 0; }
.kf-panel__form { display: flex; flex-direction: column; gap: var(--sp-sp-3); min-width: 0; }
.kf-panel__foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-sp-2); flex-wrap: wrap; }
.kf-panel__foot .kf-rowlink { margin-right: auto; }
.kf-fieldrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-sp-3); }
.kf-fld { display: flex; flex-direction: column; gap: var(--sp-sp-1); font-size: var(--sp-t-label); font-weight: var(--sp-w-bold); color: var(--sp-body); min-width: 0; }
.kf-fld > span small { font-weight: var(--sp-w-regular); }
.kf-fld .kf-ctl { width: 100%; }
.kf-what { background: var(--sp-sky-soft); border: 1px solid var(--sp-sky-line); border-radius: var(--sp-r-sm); padding: var(--sp-sp-3) var(--sp-sp-4); display: flex; flex-direction: column; gap: var(--sp-sp-2); align-self: start; min-width: 0; }
.kf-what__label { font-size: var(--sp-t-label); font-weight: var(--sp-w-heavy); color: var(--sp-navy); }
.kf-what p { font-size: var(--sp-t-table); color: var(--sp-ink); }
.kf-what p.dim { color: var(--sp-body); }
.kf-typeahead { position: relative; }
.kf-typeahead__list { list-style: none; margin: var(--sp-sp-1) 0 0; padding: var(--sp-sp-1); border: 1px solid var(--sp-line); border-radius: var(--sp-r-sm); background: var(--sp-card); box-shadow: var(--sp-shadow-lift); max-height: 264px; overflow-y: auto; }
.kf-typeahead__opt { width: 100%; min-height: var(--sp-floor-corp); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sp-3); padding: var(--sp-sp-1) var(--sp-sp-3); background: none; border: none; border-radius: var(--sp-r-xs); text-align: left; font-family: var(--sp-ui); font-size: var(--sp-t-table); color: var(--sp-ink); cursor: pointer; }
.kf-typeahead__opt:hover, .kf-typeahead__opt.is-hi { background: var(--sp-sky-tint); }
.kf-typeahead__opt small { font-size: var(--sp-t-label); color: var(--sp-body); white-space: nowrap; }
.kf-picked { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sp-3); padding: var(--sp-sp-2) var(--sp-sp-3); border: 1px solid var(--sp-line); border-radius: var(--sp-r-sm); font-size: var(--sp-t-table); }

/* ---------- messages beside a control (the one save rule) ------------- */
.kf-msg { display: inline-flex; align-items: center; gap: var(--sp-sp-2); font-size: var(--sp-t-label); font-weight: var(--sp-w-bold); }
.kf-msg--ok { color: var(--sp-good); }
.kf-msg--fail { color: var(--sp-block); background: var(--sp-block-bg); border-left: 3px solid var(--sp-block); border-radius: var(--sp-r-sm); padding: var(--sp-sp-2) var(--sp-sp-3); font-weight: var(--sp-w-regular); font-size: var(--sp-t-table); }
.kf-msg--fail b { font-weight: var(--sp-w-heavy); }
.kf-msg--why { color: var(--sp-body); font-weight: var(--sp-w-regular); }
.kf-msgrow { grid-column: 1 / -1; }

/* ---------- recent decisions ------------------------------------------ */
.kf-ledger { background: var(--sp-card); border: 1px solid var(--sp-line); border-radius: var(--sp-r-card); box-shadow: var(--sp-shadow); }
.kf-ledger__row { display: grid; grid-template-columns: 148px minmax(0, 1fr) auto auto; align-items: center; gap: var(--sp-sp-3); min-height: 56px; padding: var(--sp-sp-1) var(--sp-sp-3) var(--sp-sp-1) var(--sp-sp-4); border-top: 1px solid var(--sp-line-soft); font-size: var(--sp-t-table); }
.kf-ledger__kind { display: inline-flex; align-items: center; gap: var(--sp-sp-2); font-weight: var(--sp-w-bold); color: var(--sp-ink); font-size: var(--sp-t-label); }
.kf-ledger__kind svg { color: var(--sp-body); flex: 0 0 auto; }
.kf-ledger__what { min-width: 0; overflow-wrap: anywhere; color: var(--sp-ink); }
.kf-ledger__what small { font-size: var(--sp-t-label); color: var(--sp-body); }
.kf-ledger__when { font-size: var(--sp-t-micro); color: var(--sp-body); white-space: nowrap; }
.kf-ledger__row--undone { color: var(--sp-body); }
.kf-ledger__row--undone .kf-ledger__what { text-decoration: line-through; color: var(--sp-body); }
.kf-ledger__more { display: flex; justify-content: center; padding: var(--sp-sp-2); border-top: 1px solid var(--sp-line-soft); }

/* ---------- vendor items card ----------------------------------------- */
.kf-tcard { background: var(--sp-card); border: 1px solid var(--sp-line); border-radius: var(--sp-r-card); box-shadow: var(--sp-shadow); overflow: hidden; }
.kf-tcard__bar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sp-3); padding: var(--sp-sp-1) var(--sp-sp-2) var(--sp-sp-1) var(--sp-sp-4); min-height: var(--sp-floor-chef); font-size: var(--sp-t-label); color: var(--sp-body); }
.kf-tcard__bar--foot { border-top: 1px solid var(--sp-line-soft); }
.kf-tcard__bar b { color: var(--sp-ink); }
.kf-pager { display: inline-flex; align-items: center; gap: var(--sp-sp-1); }
.kf-pager button { width: var(--sp-floor-corp); height: var(--sp-floor-corp); display: inline-flex; align-items: center; justify-content: center; background: var(--sp-card); border: 1px solid var(--sp-line); border-radius: var(--sp-r-sm); color: var(--sp-navy); }
.kf-pager button:disabled { color: var(--sp-muted); background: var(--sp-raise); }
.kf-pager span { padding: 0 var(--sp-sp-2); font-size: var(--sp-t-label); color: var(--sp-body); white-space: nowrap; }
.kf-state-word { font-weight: var(--sp-w-bold); }
td[data-l="State"] .kf-state-word { display: block; }
.kf-state-word--link { color: var(--sp-navy); }
.kf-state-word--todo { color: var(--sp-warn); }
.kf-state-word--away { color: var(--sp-body); font-weight: var(--sp-w-regular); }

/* ---------- the panel (drawer) ----------------------------------------- */
.kf-drawer__backdrop { position: fixed; inset: 0; background: color-mix(in srgb, var(--sp-navy-deep) 35%, transparent); z-index: var(--sp-z-drawer); }
.kf-drawer { position: fixed; top: 0; right: 0; width: min(620px, 100cqw - 32px); height: 100cqh; background: var(--sp-card); border-left: 1px solid var(--sp-line); box-shadow: var(--sp-shadow-float); z-index: calc(var(--sp-z-drawer) + 1); display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.kf-dpin { position: sticky; top: 0; z-index: 2; background: var(--sp-card); border-bottom: 1px solid var(--sp-line); }
.kf-dpin__head { display: flex; align-items: flex-start; gap: var(--sp-sp-3); padding: var(--sp-sp-4) var(--sp-sp-4) var(--sp-sp-3) var(--sp-sp-5); }
.kf-dpin__body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-sp-1); }
.kf-dpin__eyebrow { font-size: var(--sp-t-label); font-weight: var(--sp-w-bold); color: var(--sp-body); overflow-wrap: anywhere; }
.kf-dpin__name { font-family: var(--sp-disp); font-weight: var(--sp-w-heavy); font-size: var(--sp-t-title); line-height: var(--sp-lh-tight); text-transform: uppercase; color: var(--sp-navy); margin: 0; overflow-wrap: anywhere; }
.kf-dpin__status { display: flex; align-items: center; gap: var(--sp-sp-2); flex-wrap: wrap; font-size: var(--sp-t-table); color: var(--sp-body); }
.kf-dpin__status b { color: var(--sp-ink); }
.kf-dpin__nav { display: inline-flex; gap: var(--sp-sp-1); flex: 0 0 auto; }
.kf-iconbtn { width: var(--sp-floor-corp); height: var(--sp-floor-corp); flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; background: var(--sp-card); color: var(--sp-navy); border: 1px solid var(--sp-line); border-radius: var(--sp-r-sm); }
.kf-iconbtn:hover { background: var(--sp-sky-tint); }
.kf-iconbtn:disabled { color: var(--sp-muted); background: var(--sp-raise); }
.kf-facts--pin { border-top: none; border-bottom: 1px solid var(--sp-line); }                /* F38: only the name is pinned; the facts sit under it and scroll */
.kf-facts--pin .kf-fact { padding-top: var(--sp-sp-2); padding-bottom: var(--sp-sp-2); }
.kf-zone { border-bottom: 1px solid var(--sp-line-soft); }
.kf-zone__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-sp-3); padding: var(--sp-sp-4) var(--sp-sp-5) var(--sp-sp-1); }
.kf-zone__title { font-family: var(--sp-ui); font-size: var(--sp-t-body); font-weight: var(--sp-w-heavy); text-transform: none; letter-spacing: 0; color: var(--sp-ink); margin: 0; }
.kf-zone__sub { font-size: var(--sp-t-label); color: var(--sp-body); }
.kf-kvrow { display: grid; grid-template-columns: 132px minmax(0, 1fr) auto; gap: var(--sp-sp-3); align-items: center; min-height: 56px; padding: var(--sp-sp-2) var(--sp-sp-4) var(--sp-sp-2) var(--sp-sp-5); border-top: 1px solid var(--sp-line-soft); }
.kf-kvrow:first-of-type { border-top: none; }
.kf-kvrow__label { font-size: var(--sp-t-label); font-weight: var(--sp-w-bold); color: var(--sp-body); }
.kf-kvrow__value { font-size: var(--sp-t-table); color: var(--sp-ink); min-width: 0; overflow-wrap: anywhere; }
.kf-kvrow__value small { display: block; font-size: var(--sp-t-label); color: var(--sp-body); }
.kf-kvrow__open { grid-column: 1 / -1; padding: var(--sp-sp-3); background: var(--sp-raise); border: 1px solid var(--sp-line-soft); border-radius: var(--sp-r-sm); display: flex; flex-direction: column; gap: var(--sp-sp-3); }
.kf-editgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-sp-3); }
.kf-editgrid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kf-result { background: var(--sp-card); border: 1px solid var(--sp-line); border-radius: var(--sp-r-sm); padding: var(--sp-sp-2) var(--sp-sp-3); font-size: var(--sp-t-table); color: var(--sp-ink); }
.kf-result b { font-size: var(--sp-t-body); }
.kf-result--warn { border-color: var(--sp-warn-strong); background: var(--sp-warn-bg); }
.kf-editfoot { display: flex; align-items: center; gap: var(--sp-sp-2); flex-wrap: wrap; }
.kf-editfoot .kf-msg { margin-right: auto; }
.kf-seg { display: inline-flex; align-self: flex-start; border: 1px solid var(--sp-line-field); border-radius: var(--sp-r-sm); overflow: hidden; }
.kf-seg button { min-height: var(--sp-floor-corp); padding: 0 var(--sp-sp-4); background: var(--sp-card); border: none; border-right: 1px solid var(--sp-line); font-family: var(--sp-ui); font-size: var(--sp-t-label); font-weight: var(--sp-w-bold); color: var(--sp-ink); }
.kf-seg button:last-child { border-right: none; }
.kf-seg button[aria-checked="true"] { background: var(--sp-navy); color: var(--sp-on-navy); }
.kf-allergens { display: flex; flex-wrap: wrap; gap: var(--sp-sp-2); }
.kf-allergens .kf-chip { min-height: var(--sp-floor-corp); }
.kf-allergens .kf-chip::before { inset: 0; }
.kf-away { display: flex; align-items: center; gap: var(--sp-sp-3); padding: var(--sp-sp-3) var(--sp-sp-5); background: var(--sp-raise); border-bottom: 1px solid var(--sp-line-soft); font-size: var(--sp-t-table); color: var(--sp-ink); }
.kf-away span { flex: 1 1 auto; }
.kf-plain { font-size: var(--sp-t-table); color: var(--sp-ink); }
.kf-plain small { font-size: var(--sp-t-label); color: var(--sp-body); }

/* ---------- overview --------------------------------------------------- */
.kf-ing--loose { gap: var(--sp-sp-5); }
.kf-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--sp-sp-3); }
.kf-tile { display: flex; flex-direction: column; gap: var(--sp-sp-1); padding: var(--sp-sp-4); background: var(--sp-card); border: 1px solid var(--sp-line); border-radius: var(--sp-r-card); box-shadow: var(--sp-shadow); text-decoration: none; color: var(--sp-ink); min-height: 118px; }
a.kf-tile:hover { text-decoration: none; border-color: var(--sp-navy); box-shadow: var(--sp-shadow-lift); }
.kf-tile__label { font-size: var(--sp-t-label); font-weight: var(--sp-w-bold); color: var(--sp-body); }
.kf-tile__value { font-family: var(--sp-disp); font-weight: var(--sp-w-heavy); font-size: var(--sp-t-title); line-height: var(--sp-lh-tight); color: var(--sp-navy); }
.kf-tile__sub { font-size: var(--sp-t-label); color: var(--sp-body); margin-top: auto; }
.kf-tile__go { display: inline-flex; align-items: center; gap: var(--sp-sp-1); font-size: var(--sp-t-label); font-weight: var(--sp-w-bold); color: var(--sp-link); }
.kf-tile--todo { border-left: 3px solid var(--sp-warn-strong); }
.kf-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-sp-4); align-items: start; }
.kf-ocard { background: var(--sp-card); border: 1px solid var(--sp-line); border-radius: var(--sp-r-card); box-shadow: var(--sp-shadow); padding: var(--sp-sp-4) var(--sp-sp-5); display: flex; flex-direction: column; gap: var(--sp-sp-3); min-width: 0; }
.kf-ocard__title { font-family: var(--sp-ui); font-size: var(--sp-t-body); font-weight: var(--sp-w-heavy); text-transform: none; letter-spacing: 0; margin: 0; }
.kf-ocard__note { font-size: var(--sp-t-label); color: var(--sp-body); }
.kf-meters { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-sp-3); }
.kf-meter { display: grid; grid-template-columns: 140px minmax(0, 1fr) 56px; gap: var(--sp-sp-3); align-items: center; font-size: var(--sp-t-label); }
.kf-meter__name { font-weight: var(--sp-w-bold); color: var(--sp-ink); overflow-wrap: anywhere; }
.kf-meter__bar { height: 10px; border-radius: var(--sp-r-pill); background: var(--sp-line-soft); overflow: hidden; }
.kf-meter__fill { display: block; height: 100%; background: var(--sp-navy); border-radius: var(--sp-r-pill); }
.kf-meter__pct { text-align: right; font-weight: var(--sp-w-bold); color: var(--sp-ink); }
.kf-health { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-sp-3); }
.kf-health div { display: flex; flex-direction: column; gap: 2px; font-size: var(--sp-t-label); color: var(--sp-body); }
.kf-health b { font-size: var(--sp-t-body); color: var(--sp-ink); }
.kf-batch { display: flex; align-items: center; gap: var(--sp-sp-2); flex-wrap: wrap; }

/* ---------- loading shapes --------------------------------------------- */
.kf-skelrow { display: flex; gap: var(--sp-sp-2); align-items: center; }
.kf-skelstack { display: flex; flex-direction: column; gap: var(--sp-sp-3); }

/* ---------- no access --------------------------------------------------- */
.kf-noaccess { max-width: 560px; margin: var(--sp-sp-8) auto; }

/* ---------- phone: look-up only ---------------------------------------- */
@container kfapp (max-width: 860px) {
  .kf-split { grid-template-columns: minmax(0, 1fr); }
  .kf-pane--list { position: static; max-height: none; }
  .kf-list { overflow: visible; }
  .kf-toolbar__row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .kf-toolbar__row--wrap { flex-wrap: wrap; overflow: visible; }
  .kf-toolbar__row::-webkit-scrollbar { display: none; }
  .kf-search { flex: 1 1 100%; max-width: none; }
  .kf-search input { min-height: var(--sp-floor-chef); }
  .kf-ctl { min-height: var(--sp-floor-chef); }
  .kf-chip { min-height: 40px; }
  .kf-row { min-height: 64px; }
  .kf-tab { font-size: var(--sp-t-body); }
  .kf-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kf-two { grid-template-columns: minmax(0, 1fr); }
  .kf-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kf-fact:nth-child(2) { border-right: none; }
  .kf-fact:nth-child(-n+2) { border-bottom: 1px solid var(--sp-line-soft); }
  .kf-fact, .kf-fact:first-child { padding: var(--sp-sp-3) var(--sp-sp-4); }
  .kf-drawer { width: 100cqw; border-left: none; }
  .kf-dpin__head { padding: var(--sp-sp-3) var(--sp-sp-3) var(--sp-sp-2) var(--sp-sp-4); }
  .kf-iconbtn { width: var(--sp-floor-chef); height: var(--sp-floor-chef); }
  .kf-kvrow { grid-template-columns: 104px minmax(0, 1fr); padding: var(--sp-sp-2) var(--sp-sp-4); }
  .kf-zone__head { padding: var(--sp-sp-3) var(--sp-sp-4) var(--sp-sp-1); }
  .kf-sec { padding: var(--sp-sp-3) var(--sp-sp-4); }
  .kf-dhead { padding: var(--sp-sp-3) var(--sp-sp-4); }
  .kf-attn { padding: var(--sp-sp-3) var(--sp-sp-4); }
  .kf-meter { grid-template-columns: 96px minmax(0, 1fr) 48px; }
  .kf-health { grid-template-columns: minmax(0, 1fr); }
  .kf-ledger__row { grid-template-columns: minmax(0, 1fr) auto; }
}
.kf-lite-note { display: flex; align-items: center; gap: var(--sp-sp-2); padding: var(--sp-sp-3) var(--sp-sp-4); background: var(--sp-sky-soft); border: 1px solid var(--sp-sky-line); border-radius: var(--sp-r-sm); font-size: var(--sp-t-label); color: var(--sp-ink); }
.kf-lrows { list-style: none; margin: 0; padding: 0; }
.kf-lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--sp-sp-3); align-items: center; width: 100%; min-height: 64px; padding: var(--sp-sp-2) var(--sp-sp-4); border: none; border-top: 1px solid var(--sp-line-soft); background: none; text-align: left; font-family: var(--sp-ui); color: var(--sp-ink); }
.kf-lrow b { font-size: var(--sp-t-body); overflow-wrap: anywhere; }
.kf-lrow span { font-size: var(--sp-t-label); color: var(--sp-body); overflow-wrap: anywhere; }
.kf-lrow strong { font-size: var(--sp-t-body); text-align: right; white-space: nowrap; }
.kf-lrow em { font-style: normal; font-size: var(--sp-t-label); color: var(--sp-body); text-align: right; white-space: nowrap; }
.kf-back { min-height: var(--sp-floor-chef); display: inline-flex; align-items: center; gap: var(--sp-sp-2); padding: 0 var(--sp-sp-3) 0 var(--sp-sp-2); background: none; border: none; color: var(--sp-link); font-family: var(--sp-ui); font-size: var(--sp-t-body); font-weight: var(--sp-w-bold); align-self: flex-start; }

@media (prefers-reduced-motion: reduce) { .kf-fold__btn svg { transition: none; } }

/* ---------- small pieces the views share -------------------------------- */
small { font-size: var(--sp-t-label); }   /* IN THE APP: scope this to Stockpot's own root, never a bare element rule. */
.kf-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.kf-helpline { font-size: var(--sp-t-label); color: var(--sp-body); }
.kf-helpline b { color: var(--sp-ink); }
.kf-namebtn { position: relative; display: inline; padding: 0; background: none; border: none; border-radius: var(--sp-r-xs); text-align: left; font-family: var(--sp-ui); font-size: var(--sp-t-body); font-weight: var(--sp-w-bold); line-height: var(--sp-lh-snug); color: var(--sp-ink); cursor: pointer; overflow-wrap: anywhere; }
.kf-namebtn::before { content: ""; position: absolute; inset: -12px 0; min-width: var(--sp-floor-corp); }   /* a 44px hit area on one line of 16px type, and on a short name */
.kf-namebtn:hover { color: var(--sp-link); text-decoration: underline; }
.kf-iconbtn--on { background: var(--sp-warn-bg); border-color: var(--sp-warn-strong); color: var(--sp-warn); }
.kf-itable tr:has(+ .kf-itable__note) td { border-bottom: none; }
.kf-itable__note td { padding-top: 0; }
.kf-itable--pad th:first-child, .kf-itable--pad td:first-child { padding-left: var(--sp-sp-4); }
.kf-itable--pad th:last-child, .kf-itable--pad td:last-child { padding-right: var(--sp-sp-4); }
.kf-itable td.kf-itable__tick, .kf-itable--review th:first-child { padding-left: var(--sp-sp-2); padding-right: 0; }
.kf-inline { display: flex; align-items: flex-end; gap: var(--sp-sp-2); flex-wrap: wrap; }
.kf-inline > .kf-word, .kf-inline > .kf-msg { align-self: center; flex: 1 1 200px; }
.kf-fld--grow { flex: 1 1 260px; }
.kf-fld--half { max-width: 50%; }
.kf-fld__cap { font-size: var(--sp-t-label); font-weight: var(--sp-w-bold); color: var(--sp-body); }
.kf-inlinewhat { display: flex; flex-direction: column; gap: var(--sp-sp-3); margin-bottom: var(--sp-sp-3); }
.kf-plainlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.kf-plainlist li { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-sp-3); padding: var(--sp-sp-2) 0; border-top: 1px solid var(--sp-line-soft); font-size: var(--sp-t-table); color: var(--sp-ink); }
.kf-plainlist li:first-child { border-top: none; }
.kf-plainlist li span { color: var(--sp-body); font-size: var(--sp-t-label); text-align: right; overflow-wrap: anywhere; min-width: 0; }
.kf-plainlist--rows li { align-items: center; min-height: var(--sp-floor-corp); padding: 0; }
.kf-plainlist--rows li span { flex: 1 1 auto; text-align: left; }
.kf-rowlink--block { position: relative; display: inline; min-height: 0; padding: 0; text-align: left; white-space: normal; overflow-wrap: anywhere; }
.kf-rowlink--block::before { content: ""; position: absolute; inset: -15px 0; min-width: var(--sp-floor-corp); }   /* a short name still gets a full-size target */
.kf-rowlink--start { align-self: flex-start; margin-left: calc(-1 * var(--sp-sp-2)); }
.kf-rowlink:disabled { color: var(--sp-muted); cursor: not-allowed; }
.kf-ctl--vendor { max-width: 240px; }
.kf-typeahead__none { padding: var(--sp-sp-2) var(--sp-sp-3); font-size: var(--sp-t-label); color: var(--sp-body); }
.kf-msg--hint { display: flex; }
.kf-pane__head--sub { background: var(--sp-raise); border-top: 1px solid var(--sp-line-soft); }

/* ---------- the panel: more pieces --------------------------------------- */
.kf-askbar { display: flex; align-items: center; gap: var(--sp-sp-2); flex-wrap: wrap; padding: var(--sp-sp-3) var(--sp-sp-5); background: var(--sp-warn-bg); border-bottom: 1px solid var(--sp-warn-strong); font-size: var(--sp-t-table); color: var(--sp-ink); }
.kf-askbar > span { flex: 1 1 220px; }
.kf-kvrow__act { display: inline-flex; gap: var(--sp-sp-2); }
.kf-kvrow__msg { grid-column: 1 / -1; }
.kf-kvrow__value b { font-weight: var(--sp-w-bold); }
.kf-kvrow__value .kf-msg { margin-top: var(--sp-sp-1); }
.kf-kvrow__value select.kf-ctl { width: min(100%, 220px); }
.kf-inlinesmall { display: inline !important; }
.kf-known { display: flex; align-items: center; gap: var(--sp-sp-1); flex-wrap: wrap; }
.kf-result .kf-fld__cap { display: block; }
.kf-result__warn { display: flex; gap: var(--sp-sp-2); align-items: flex-start; margin-top: var(--sp-sp-1); color: var(--sp-warn); font-weight: var(--sp-w-bold); font-size: var(--sp-t-label); }
.kf-result__warn svg { flex: 0 0 auto; margin-top: 2px; }
.kf-fact__value--text { font-family: var(--sp-ui); font-size: var(--sp-t-body); line-height: var(--sp-lh-snug); padding: var(--sp-sp-1) 0; color: var(--sp-ink); }
.kf-measure { display: flex; align-items: center; gap: var(--sp-sp-2); flex-wrap: wrap; }
.kf-zone__foot { display: flex; align-items: center; gap: var(--sp-sp-3); flex-wrap: wrap; padding: var(--sp-sp-3) var(--sp-sp-5) var(--sp-sp-4); }
.kf-zone__form { display: flex; flex-direction: column; gap: var(--sp-sp-3); padding: var(--sp-sp-2) var(--sp-sp-5) var(--sp-sp-4); }
.kf-zone__head .kf-msg { margin-left: auto; }
.kf-fold__body.kf-zone__form { padding-top: 0; }
.kf-lite-note--in { margin: var(--sp-sp-3) var(--sp-sp-4) 0; }
.kf-dpin__nav .kf-btn { white-space: nowrap; }
.kf-drawer .kf-fold:last-child { border-bottom: 1px solid var(--sp-line-soft); margin-bottom: var(--sp-sp-6); }

/* ---------- overview: more pieces ---------------------------------------- */
.kf-ocard--row { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.kf-ocard--row > div:first-child { flex: 1 1 320px; display: flex; flex-direction: column; gap: var(--sp-sp-1); min-width: 0; }
.kf-ocard__note b { color: var(--sp-ink); }
.kf-ocard__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sp-3); flex-wrap: wrap; border-top: 1px solid var(--sp-line-soft); padding-top: var(--sp-sp-2); font-size: var(--sp-t-label); color: var(--sp-body); }
.kf-health div span { font-size: var(--sp-t-label); }
.kf-tile__go { margin-top: var(--sp-sp-1); }

/* ---------- between a phone and a wide desk: one column, labelled rows ---- */
@container kfapp (max-width: 1100px) {
  .kf-split { grid-template-columns: minmax(0, 1fr); }
  .kf-tab { padding: 0 var(--sp-sp-3); }
  .kf-pane--list { position: static; max-height: 312px; }
  .kf-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kf-panel { grid-template-columns: minmax(0, 1fr); }
  .kf-rvc__exits { margin-left: 0; }
  .kf-itable--stack, .kf-itable--stack tbody { display: block; }
  .kf-itable--stack colgroup, .kf-itable--stack thead { display: none; }
  .kf-itable--stack tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-sp-1) var(--sp-sp-3); padding: var(--sp-sp-2) var(--sp-sp-3); border-bottom: 1px solid var(--sp-line-soft); position: relative; }
  .kf-itable--stack tr:last-child { border-bottom: none; }
  .kf-itable--stack td { display: block; border: none; padding: 0; text-align: left; }
  .kf-itable--stack td.num { text-align: left; }
  .kf-itable--stack td[data-l="Item"], .kf-itable--stack td.act, .kf-itable--stack .kf-itable__note td { grid-column: 1 / -1; }
  .kf-itable--stack td[data-l]:not([data-l="Item"])::before { content: attr(data-l); display: block; font-size: var(--sp-t-label); font-weight: var(--sp-w-bold); color: var(--sp-body); }
  .kf-itable--stack td.act { text-align: left; }
  .kf-itable--review tr { padding-left: 56px; padding-right: 56px; }
  .kf-itable--review td.kf-itable__tick { position: absolute; left: var(--sp-sp-1); top: var(--sp-sp-1); width: auto; }
  .kf-itable--review td.act { position: absolute; right: var(--sp-sp-1); top: var(--sp-sp-1); }
  .kf-itable--review .kf-itable__note td:first-child { display: none; }
  .kf-itable--pad tr { padding-left: var(--sp-sp-4); padding-right: var(--sp-sp-4); }
  .kf-tick { margin: 0; }
}

/* ---------- phone: look-up pieces ------------------------------------------ */
.kf-lrows--first > li:first-child .kf-lrow { border-top: none; }
.kf-lrow--door b { display: inline-flex; align-items: center; gap: var(--sp-sp-2); }
.kf-lrow em svg { vertical-align: middle; }
.kf-labelled--full { width: 100%; }
.kf-labelled--full select { flex: 1 1 auto; }
@container kfapp (max-width: 860px) {
  .kf-ing, .kf-drawer { --sp-t-table: var(--sp-t-body); }               /* five sizes on a phone: the table size steps up to body, inside Stockpot only */
  .kf-rowlink { min-height: var(--sp-floor-chef); }
  .kf-rowlink--block { min-height: 0; }
  .kf-rowlink--block::before { inset: -17px 0; min-width: var(--sp-floor-chef); }
  .kf-back { min-height: var(--sp-floor-chef); }
  .kf-fold__btn { padding: 0 var(--sp-sp-4); }
  .kf-fold__body { padding: 0 var(--sp-sp-4) var(--sp-sp-4); }
  .kf-zone__foot, .kf-zone__form { padding-left: var(--sp-sp-4); padding-right: var(--sp-sp-4); }
  .kf-away { padding: var(--sp-sp-3) var(--sp-sp-4); }
  .kf-askbar { padding: var(--sp-sp-3) var(--sp-sp-4); }
  .kf-kvrow__act { grid-column: 1 / -1; }
  .kf-empty { flex-direction: column; }
}

/* ---- recompute an ingredient's simple numbers after a change made in the render ---- */
function recalc(ing) {
  const its = ing.items.map((id) => ITEMS[id]).filter(Boolean);
  ing.linked = its.length; ing.usd = its.reduce((s, x) => s + (x.usd || 0), 0);
  const pr = its.filter((x) => x.pi != null && !x.sk && !x.out);
  ing.priced = its.filter((x) => x.pi != null).length;
  if (pr.length) { const w = pr.reduce((s, x) => s + Math.max(x.usd || 0, 1), 0); ing.avg = pr.reduce((s, x) => s + x.pi * Math.max(x.usd || 0, 1), 0) / w; ing.min = Math.min.apply(null, pr.map((x) => x.pi)); ing.max = Math.max.apply(null, pr.map((x) => x.pi)); ing.spr = ing.min > 0 ? Math.round((ing.max / ing.min) * 10) / 10 : null; }
  else { ing.avg = null; ing.min = null; ing.max = null; ing.spr = null; }
  const lensOfSet = (set) => { const p = set.filter((x) => x.pi != null && !x.sk && !x.out); if (!p.length) return [null, null, null, null, 0, set.length]; const w = p.reduce((s, x) => s + Math.max(x.usd || 0, 1), 0); const mn = Math.min.apply(null, p.map((x) => x.pi)), mx = Math.max.apply(null, p.map((x) => x.pi)); return [p.reduce((s, x) => s + x.pi * Math.max(x.usd || 0, 1), 0) / w, mn, mx, mn > 0 ? Math.round((mx / mn) * 10) / 10 : null, p.length, set.length]; };
  ing.lens = { b: [ing.avg, ing.min, ing.max, ing.spr, ing.priced, ing.linked], s: lensOfSet(its.filter((x) => x.g !== "premium")), p: lensOfSet(its.filter((x) => x.g === "premium")) };
  const iss = (ing.issues || []).filter((k) => ["spread", "band"].indexOf(k) >= 0);
  if (its.some((x) => x.sk === "needs_measure")) iss.push("needs_measure"); if (its.some((x) => x.sk === "sizes_differ")) iss.push("sizes_differ"); if (its.some((x) => x.out || x.sk === "check_it")) iss.push("outlier");
  if (ing.priced < ing.linked) iss.push("coverage"); if (!ing.linked) iss.push("empty"); ing.issues = iss;
}

const INPUT = {
  "rv-search"(v) { S.rev.q = v; }, "ing-search"(v) { ingState().q = v; S.ph.ingN = PH_STEP; }, "vi-search"(v) { S.vi.q = v; S.vi.page = 0; S.ph.itemN = PH_STEP; }, "ph-search"(v) { S.ph.q = v; },
  "rv-name"(v, el) { gForm(getGroup(el.getAttribute("data-g"))).name = v; }, "rv-subnew"(v, el) { gForm(getGroup(el.getAttribute("data-g"))).subNew = v; }, "rv-q"(v, el) { gForm(getGroup(el.getAttribute("data-g"))).q = v; S.taHi = 0; },
  "flag-note"(v) { S.rev.flagNote = v; return false; },
  "pk-qty"(v) { S.panel.draft.qty = v; }, "pk-size"(v) { S.panel.draft.size = v; }, "pk-cp"(v) { S.panel.draft.cp = v; }, "pk-perlb"(v) { S.panel.draft.perlb = v; }, "pk-note"(v) { S.panel.draft.note = v; },
  "ph-v"(v) { S.panel.draft.v = v; }, "ph-note"(v) { S.panel.draft.note = v; }, "cw-v"(v) { S.panel.draft.v = v; }, "ms-qty"(v) { S.panel.draft.qty = v; },
  "ig-name"(v) { S.panel.draft.name = v; }, "ig-subnew"(v) { S.panel.draft.subNew = v; }, "im-qty"(v) { S.panel.md.qty = v; }, "ig-yield"(v) { S.panel.yd = v; }, "merge-q"(v) { S.panel.merge.q = v; S.taHi = 0; },

const CHANGE = {
  tick(el) { const g = getGroup(el.getAttribute("data-g")); if (g) gTick(g)[el.getAttribute("data-id")] = el.checked; },

  "rv-cat"(el) { const f = gForm(getGroup(el.getAttribute("data-g"))); f.cat = el.value; if (f.sub && !ING.some((x) => x.sub === f.sub && x.cat === f.cat)) f.sub = ""; },

  "pk-uom"(el) { S.panel.draft.uom = el.value; }, "pk-bu"(el) { S.panel.draft.bu = el.value; }, "ms-from"(el) { S.panel.draft.from = el.value; }, "ms-to"(el) { S.panel.draft.to = el.value; }, "ms-source"(el) { S.panel.draft.source = el.value; },
  unit(el) { const g = INGBY[el.getAttribute("data-id")]; if (g) setUnit(g, el.value, S.panel, "unit"); return false; },
  "ig-cat"(el) { const d = S.panel.draft; d.cat = el.value; if (d.sub && !ING.some((x) => x.sub === d.sub && x.cat === d.cat)) d.sub = ""; }, "ig-sub"(el) { S.panel.draft.sub = el.value; },
  "im-from"(el) { S.panel.md.from = el.value; }, "im-to"(el) { S.panel.md.to = el.value; },

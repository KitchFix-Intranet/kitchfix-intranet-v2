/* ---- wiring ---- */
function applySize() {
  const dv = $("#device"), stage = $("#stage"); if (!dv) return; const bare = document.documentElement.classList.contains("bare");
  const z0 = $("#rc-zoom"); if (z0) z0.textContent = "";
  if (S.size === "fit" || bare) { dv.style.cssText = ""; dv.classList.remove("kf-device--framed"); return; }
  const wh = S.size.split("x").map(Number); const pad = 24; const sc = Math.min(1, (stage.clientWidth - pad) / wh[0], (stage.clientHeight - pad) / wh[1]);
  dv.classList.add("kf-device--framed"); dv.style.cssText = "width:" + wh[0] + "px;height:" + wh[1] + "px;transform:scale(" + sc.toFixed(4) + ");margin-bottom:" + Math.round(-(1 - sc) * wh[1]) + "px;margin-right:" + Math.round(-(1 - sc) * wh[0] / 2) + "px;margin-left:" + Math.round(-(1 - sc) * wh[0] / 2) + "px";
  const z = $("#rc-zoom"); if (z) z.textContent = sc < 0.995 ? "Shown at " + Math.round(sc * 100) + "% to fit." + (sc < 0.8 ? " Open this file in its own browser window to see it full size." : "") : "";
}
function moveList(d) {
  const st = ingState(); const rows = ingRows().rows; if (!rows.length) return; let i = rows.findIndex((g) => g.id === st.sel); if (i < 0) i = 0;
  const j = d === "home" ? 0 : d === "end" ? rows.length - 1 : Math.max(0, Math.min(rows.length - 1, i + d)); st.sel = rows[j].id; st.sendAll = null; st.allItems = null; S.focusNext = "inglist"; render();
  const opt = document.getElementById("opt-" + st.sel); if (opt && opt.scrollIntoView) opt.scrollIntoView({ block: "nearest" });
}
function trapTab(e) {
  const dr = $("[data-drawer]"); if (!dr) return; const f = $$('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', dr).filter((x) => x.offsetParent !== null); if (!f.length) return;
  const first = f[0], last = f[f.length - 1]; if (!dr.contains(document.activeElement)) { e.preventDefault(); first.focus(); } else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
document.addEventListener("click", (e) => {
  const rc = e.target.closest("[data-rc]"); if (rc) { const k = rc.getAttribute("data-rc"); if (k === "calls" || k === "table") { S.overlay = S.overlay === k ? null : k; paintOverlay(); paintControls(); } else if (k === "close-overlay") { S.overlay = null; paintOverlay(); paintControls(); } else if (k === "back") navBack(); else if (k === "reset") { try { location.reload(); } catch (err) { rnote("Reload the file to start over."); } } return; }
  if (e.target.id === "overlay") { S.overlay = null; paintOverlay(); paintControls(); return; }
  const el = e.target.closest("[data-a]"); if (!el || el.disabled || el.getAttribute("aria-disabled") === "true") return;
  if (el.tagName === "A") e.preventDefault(); if (el.type === "submit" && el.form) return;
  if (el.tagName === "LI" && e.target.closest("button, a, input, select") && e.target.closest("button, a, input, select") !== el) return;
  const fn = ACT[el.getAttribute("data-a")]; if (fn) fn(el, e);
});
document.addEventListener("submit", (e) => { e.preventDefault(); const f = e.target.closest("[data-form]"); if (!f) return; const fn = SUBMIT[f.getAttribute("data-form")]; if (fn) fn(f); });
document.addEventListener("input", (e) => { const el = e.target; const k = el.getAttribute && el.getAttribute("data-i"); if (!k || !INPUT[k]) return; if (INPUT[k](el.value, el) !== false) render(); });
document.addEventListener("change", (e) => {
  const el = e.target; if (el.id && el.id.indexOf("rc-") === 0) { rcChange(el); return; }
  const k = el.getAttribute && el.getAttribute("data-c"); if (!k || !CHANGE[k]) return; if (CHANGE[k](el) !== false) render();
});
function clearToasts() { S.toasts.forEach((x) => clearInterval(x.timer)); S.toasts = []; }
function rcChange(el) {
  if (el.id !== "rc-save" && el.id !== "rc-page") clearToasts();
  if (el.id === "rc-page") { if (S.panel && panelDirty()) { closePanel(false, "close"); return; } go(el.value); return; }
  if (el.id === "rc-viewer") { if (el.value === "none") S.viewer = "none"; else { S.viewer = "owner"; if (el.value === "phone" && !/^(390|360)x/.test(S.size)) S.size = "390x844"; if (el.value === "desk" && /^(390|360|820)x/.test(S.size)) S.size = "fit"; } S.panel = null; S.phoneView = null; applySize(); render(); return; }
  if (el.id === "rc-size") { S.size = el.value; S.panel = null; S.phoneView = null; applySize(); render(); return; }
  if (el.id === "rc-state") { S.state = el.value; S.panel = null; render(); return; }

}
document.addEventListener("keydown", (e) => {
  const t = e.target; const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT") && t.type !== "checkbox";
  if (e.key === "Escape") {
    if (S.overlay) { S.overlay = null; paintOverlay(); paintControls(); return; }
    const P = S.panel;
    if (P) { e.preventDefault(); if (P.ask) { ACT["ask-keep"](); return; } if (P.kind === "item" && P.edit) { closePanel(false, "editor"); return; } if (P.kind === "ing" && P.merge.open && t && t.getAttribute("data-i") === "merge-q" && P.merge.q) { P.merge.q = ""; render(); return; } closePanel(false, "close"); return; }
    if (t && t.getAttribute && t.getAttribute("data-k") === "search" && t.value) { ACT["clear-search"](); return; }
    const card = t && t.closest ? t.closest(".kf-rvc") : null; if (card && S.page === "review") { const ks = Object.keys(S.rev.open).filter((k) => S.rev.open[k]); const inCard = ks.find((k) => card.querySelector('[data-g="' + k + '"]')); if (inCard) { ACT["rv-close"]({ getAttribute: () => inCard }); return; } }

/* a toast holds still while the pointer or the keyboard is on it */
document.addEventListener("mouseover", (e) => { const t = e.target.closest && e.target.closest("[data-toast]"); S.toasts.forEach((x) => { x.paused = !!t && t.getAttribute("data-toast") === x.id; }); });
document.addEventListener("focusin", (e) => { const t = e.target.closest && e.target.closest("[data-toast]"); if (t) S.toasts.forEach((x) => { if (x.id === t.getAttribute("data-toast")) x.paused = true; }); });
let RZ = null; window.addEventListener("resize", () => { clearTimeout(RZ); RZ = setTimeout(() => { applySize(); render(); }, 120); });

/* ---- start ---- */
(function start() {
  if (/bare/.test(location.hash)) document.documentElement.classList.add("bare");
  else if ($("#stage").clientWidth < 1100) S.size = "1440x900";                              // a narrow preview pane would otherwise show the phone version
  const first = ING.filter((g) => !g.retail).sort((a, b) => (b.usd || 0) - (a.usd || 0))[0]; if (first) S.ing.sel = first.id;
  const firstR = ING.filter((g) => g.retail).sort((a, b) => (b.usd || 0) - (a.usd || 0))[0]; if (firstR) S.retail.sel = firstR.id;
  applySize(); HIST.push(navSnap()); render(); paintOverlay();
  const n = $("#rc-calls-n"); if (n) n.textContent = CALLS.length;
})();
